# Local development database for ticket-demo.
# Usage:
#   1. Create .env from .env.example and fill in both passwords
#   2. docker compose up -d
#      (mssql-init runs db/init/*.sql once the server is healthy; it is idempotent)
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    container_name: ticket-demo-mssql
    environment:
      ACCEPT_EULA: "Y"
      # Standard Developer: free, non-production, limited to Standard edition features
      MSSQL_PID: "StandardDeveloper"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      TZ: "Asia/Taipei"
    ports:
      # Loopback only: not reachable from other machines on the network
      - "127.0.0.1:1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      # Password goes through SQLCMDPASSWORD, not the -P argument, so it stays out of the process list
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot job: creates the ticket_demo database and the application login.
  mssql-init:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    container_name: ticket-demo-mssql-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      SQLCMDPASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      # Read by the init script as the sqlcmd variable $(APP_DB_PASSWORD)
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    volumes:
      - ./db/init:/init:ro
    entrypoint: ["/bin/sh", "-c", "for f in /init/*.sql; do echo \"running $$f\"; /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -b -i \"$$f\" || exit 1; done"]
    restart: "no"

volumes:
  mssql-data:
